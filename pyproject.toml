[project]
name = "bookbuddy"
version = "0.5.0"
description = "Turn books and documents into natural-sounding audiobooks, locally (Kokoro TTS, ffmpeg M4B)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "reed-and-write" }]
requires-python = ">=3.11,<3.13"
dependencies = [
  # torch needs a CUDA 12.8+ (Blackwell / RTX 50xx) build on those GPUs; install it from the PyTorch cu128 index:
  #   uv pip install --index-url https://download.pytorch.org/whl/cu128 --extra-index-url https://pypi.org/simple torch
  "torch>=2.8",
  "kokoro>=0.9.4,<1",
  "misaki[en]>=0.9.4,<1",
  "numpy>=2",
  "soundfile>=0.13",
  "ebooklib>=0.18",
  "beautifulsoup4>=4.12",
  "lxml>=5",
  "num2words>=0.5.13",
  "pypdf>=5",       # PDF bookmarks/outline (text itself comes from poppler pdftotext)
  "platformdirs>=4",
  "python-docx>=1.1",          # .docx (MIT)
  "striprtf>=0.0.26",          # .rtf (BSD-3-Clause)
  "pillow>=10",                # page images for OCR (HPND)
  "charset-normalizer>=3",     # .txt encoding detection (MIT)
  "fastapi>=0.115",            # HTTP API (MIT)
  "uvicorn>=0.30",             # ASGI server (BSD-3-Clause)
  "python-multipart>=0.0.9",   # file uploads (Apache-2.0)
  "anthropic>=0.40",           # optional LLM cleanup with the user's own Claude key (MIT-compatible: Apache-2.0)
  "openai>=1.50",              # optional LLM cleanup with the user's own OpenAI key (Apache-2.0)
  # spaCy model used by misaki; misaki pip-installs it on first run if missing
  "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]

[project.optional-dependencies]
ocr = ["ocrmypdf>=16"]   # optional: better PDF OCR (MPL-2.0, run as a program); Tesseract alone works without it
dev = ["pytest>=8", "httpx>=0.27", "reportlab>=4", "odfpy>=1.4"]   # reportlab/odfpy only build the fixtures in tests/make_*_fixtures.py

[project.scripts]
bookbuddy = "bookbuddy.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bookbuddy*"]

[tool.setuptools.package-data]
bookbuddy = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: needs CUDA + Kokoro weights"]
